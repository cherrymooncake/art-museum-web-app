server {
    listen 80;
    server_name localhost;

    location /api {
        proxy_pass http://host.docker.internal:4000;  # Порт NestJS-приложения
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://host.docker.internal:3000;  # Порт Next.js
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
